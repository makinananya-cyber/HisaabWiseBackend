# Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
#
# This file documents the deployed service and lets it be recreated from the Render dashboard
# ("New > Blueprint"). It carries no secrets: every value that is one is marked `sync: false`
# and set in the dashboard's Environment tab, or generated by Render itself.
#
# Region is Singapore — the closest Render region to the Asia/Kolkata and Asia/Kathmandu users
# the product is written for (Product Spec §4.5).
services:
  # ---------------------------------------------------------------------------
  # Backend API — Node web service (Hono + TypeScript, bundled by esbuild)
  #
  # One process serves the HTTP API *and* runs the scheduled jobs, because
  # `src/server.ts` calls `startScheduler` after binding the port. There is no
  # separate worker service on purpose: `src/scheduler.ts` documents that the
  # jobs are safe to run in every instance (the unique `(userId, monthKey)`
  # index makes a doubled rollover harmless), so splitting them out would buy
  # nothing until this runs at more than one instance.
  #
  # CAVEAT on `plan: free` — a free instance spins down after ~15 minutes with
  # no inbound traffic, and a spun-down process runs no timers. `month:rollover`
  # is on a 15-minute interval and `purge:deleted` on a daily one, so on the
  # free plan both fire only opportunistically, whenever a request happens to
  # wake the instance. Move to `starter` before the jobs need to be trusted.
  # ---------------------------------------------------------------------------
  - type: web
    name: hisaabwise-backend
    repo: https://github.com/makinananya-cyber/HisaabWiseBackend
    runtime: node
    plan: free
    region: singapore
    # Every push to this branch deploys. Change it here rather than in the
    # dashboard, so the branch a deploy comes from stays readable in the repo.
    branch: feat-render-deploy
    # `--include=dev` because the build needs esbuild and typescript, and Render
    # sets NODE_ENV=production, which would otherwise omit them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # The shallow endpoint on purpose: it does no database work, so Render's
    # probe does not spend an Atlas connection per poll (ADR-0013).
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Pinned, and not left to `engines.node` in package.json — that says
      # `>=20`, which would let Render pick Node 20, while the esbuild target is
      # `node22`. A bundle emitting Node 22 syntax onto a Node 20 runtime fails
      # at startup, not at build time.
      - key: NODE_VERSION
        value: "22"

      # Render injects PORT itself; `loadConfig` reads it and falls back to 8080
      # only when it is absent, so it is deliberately not pinned here.

      - key: LOG_LEVEL
        value: info

      # ── Database ───────────────────────────────────────────────────────────
      # Required to boot, and the URI MUST name the database in its path — one
      # ending at `mongodb.net/` silently resolves to a database called `test`,
      # so the server refuses to start without one. Atlas also needs 0.0.0.0/0
      # in its IP access list, or Render's egress addresses, before this
      # connects. Set in the dashboard.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_MAX_POOL_SIZE
        value: "10"

      # ── Auth ───────────────────────────────────────────────────────────────
      # Generated once by Render and stable afterwards. Rotating it invalidates
      # every outstanding access token, so do not regenerate it casually.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 60d

      # ── The rest are optional in `loadConfig` and enforced by `requireSecret`
      # at the point of use, so the service boots without them and fails loudly,
      # naming the variable, only in the slice that needs one. Set in the
      # dashboard as each feature goes live.
      - key: FX_PROVIDER_API_KEY
        sync: false
      - key: FX_BASE_CURRENCY
        value: USD

      - key: APNS_KEY_P8
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false

      - key: SENTRY_DSN
        sync: false

      # Marketing site only — the iOS client needs no CORS. Comma-separated;
      # empty allows nothing.
      - key: CORS_ORIGINS
        sync: false

      # ── Application-level rate limiting ────────────────────────────────────
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"
